[project]
name = "fraude-xai-ibm-tabformer"
version = "1.0.0"
description = "Détection de fraude explicable (IBM TabFormer) – application Streamlit et API FastAPI"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E501", "I001"]
